server:
  port: ${SERVER_PORT:8899}

spring:
  application:
    name: toolbox
  # Redis 仅按需启用（TOOLBOX_STORE_CONVERSATION/TOOLBOX_STORE_CONNECTION=redis 时）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

toolbox:
  # ============================================
  # 存储类型配置 — local / redis / oss / jdbc
  # 通过环境变量 TOOLBOX_STORE_XXX 可覆盖
  # ============================================
  store:
    file-store: ${TOOLBOX_STORE_FILE:local}
    conversation-store: ${TOOLBOX_STORE_CONVERSATION:redis}
    connection-registry: ${TOOLBOX_STORE_CONNECTION:redis}

  libreoffice:
    # soffice 二进制路径
    binary-path: soffice
    # 最大并发转换数（每个 soffice 进程约占用 200-500MB 内存）
    max-concurrent: 10

  # ============================================
  # Playwright 渲染配置
  # ============================================
  playwright:
    # 最大并发 Chromium 实例数（每个约 500MB 内存）
    max-concurrent: ${TOOLBOX_PLAYWRIGHT_MAX_CONCURRENT:2}

  # ============================================
  # 安全防控配置
  # ============================================
  security:
    rate-limit:
      # 限流开关
      enabled: true
      # 限流存储后端: local（单机内存）| redis（分布式）
      store: ${TOOLBOX_RATE_LIMIT_STORE:redis}
      # 全局默认每秒令牌数（未标注 @RateLimit 的方法使用此值）
      default-permits-per-second: 5.0
      # 全局默认令牌桶容量（允许的最大突发请求数）
      default-burst: 10
    # URL 安全防护
    url-protection:
      enabled: true
      # 阻止访问内网/私有 IP
      block-private-ips: true
    # 文件安全校验
    file-validation:
      # 文件魔数校验（检查文件实际内容而非仅看扩展名）
      check-magic-bytes: true
  # ============================================
  # Agent — 文档处理 AI Agent 配置
  # ============================================
  agent:
    # LLM 提供商: dashscope / openai / deepseek
    llm-provider: ${LLM-PROVIDER:deepseek}
    llm-model: ${LLM_MODEL:deepseek-v4-pro}
    # API Key
    llm-api-key: ${LLM_API_KEY:REDACTED_KEY}
    # API Base URL（可选。内网部署时改为自己的 OpenAI 兼容代理地址）
    llm-base-url: ${LLM_BASE_URL:}
    # SSE 连接管理
    sse:
      max-connections: 50
      heartbeat-interval-ms: 15000
      connection-timeout-ms: 7200000
    # Redis 连接（仅在 TOOLBOX_STORE_CONVERSATION=redis 或 TOOLBOX_STORE_CONNECTION=redis 时需要）
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:toolbox-redis-2026}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 2
    # 对话管理
    conversation:
      max-rounds: 50
      ttl-minutes: 30
    # 文件管理
    file:
      upload-dir: /tmp/toolbox-agent
      cleanup-interval-minutes: 30
      max-file-size: 52428800

logging:
  level:
    root: INFO
    com.toolbox: DEBUG

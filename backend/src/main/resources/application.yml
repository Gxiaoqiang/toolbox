server:
  port: ${SERVER_PORT:8899}

spring:
  application:
    name: toolbox
  # 默认启用 local profile：本地运行会读取（gitignore 的）application-local.yml 中的本地密钥
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # Redis 仅按需启用（TOOLBOX_STORE_CONVERSATION/TOOLBOX_STORE_CONNECTION=redis 时）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

toolbox:
  # ============================================
  # 存储类型配置 — local / redis / oss / jdbc
  # 通过环境变量 TOOLBOX_STORE_XXX 可覆盖
  # ============================================
  store:
    file-store: ${TOOLBOX_STORE_FILE:local}
    conversation-store: ${TOOLBOX_STORE_CONVERSATION:redis}
    connection-registry: ${TOOLBOX_STORE_CONNECTION:redis}

  libreoffice:
    # soffice 二进制路径
    binary-path: soffice
    # 最大并发转换数（每个 soffice 进程约占用 200-500MB 内存）
    max-concurrent: 10

  # ============================================
  # Playwright 渲染配置
  # ============================================
  playwright:
    # 最大并发 Chromium 实例数（每个约 500MB 内存）
    max-concurrent: ${TOOLBOX_PLAYWRIGHT_MAX_CONCURRENT:2}

  # ============================================
  # 安全防控配置
  # ============================================
  security:
    rate-limit:
      # 限流开关
      enabled: true
      # 限流存储后端: local（单机内存）| redis（分布式）
      store: ${TOOLBOX_RATE_LIMIT_STORE:redis}
      # 全局默认每秒令牌数（未标注 @RateLimit 的方法使用此值）
      default-permits-per-second: 5.0
      # 全局默认令牌桶容量（允许的最大突发请求数）
      default-burst: 10
    # URL 安全防护
    url-protection:
      enabled: true
      # 阻止访问内网/私有 IP
      block-private-ips: true
    # 文件安全校验
    file-validation:
      # 文件魔数校验（检查文件实际内容而非仅看扩展名）
      check-magic-bytes: true
  # ============================================
  # Agent — 文档处理 AI Agent 配置
  # ============================================
  agent:
    # 是否启用文档助手：false 时不加载 LLM 模型、不创建 Agent 相关 Bean、前端不展示该工具
    enabled: ${TOOLBOX_AGENT_ENABLED:true}
    # LLM 提供商: dashscope / openai / deepseek
    llm-provider: ${LLM-PROVIDER:deepseek}
    llm-model: ${LLM_MODEL:deepseek-v4-pro}
    # API Key（生产/CI 用环境变量 LLM_API_KEY；本地可放 application-local.yml，勿提交明文）
    llm-api-key: ${LLM_API_KEY:}
    # API Base URL（可选。内网部署时改为自己的 OpenAI 兼容代理地址）
    llm-base-url: ${LLM_BASE_URL:}
    # SSE 连接管理
    sse:
      max-connections: 50
      heartbeat-interval-ms: 15000
      connection-timeout-ms: 7200000
    # Redis 连接（仅在 TOOLBOX_STORE_CONVERSATION=redis 或 TOOLBOX_STORE_CONNECTION=redis 时需要）
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:toolbox-redis-2026}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 2
    # 对话管理
    conversation:
      max-rounds: 50
      ttl-minutes: 30
    # 文件管理
    file:
      upload-dir: /tmp/toolbox-agent
      cleanup-interval-minutes: 30
      max-file-size: 52428800
    # 异常文案配置 — 关键词→用户提示文案，外部化避免硬编码；message 支持 {msg} 占位符
    error:
      fallback-message: "处理时遇到了问题，请稍后重试。如果持续出现，请联系管理员。"
      rules:
        # 用户层 — 文件相关
        - keywords: ["文件为空", "empty"]
          message: "文件为空，请上传有效的文件。"
          log-error: false
        - keywords: ["文件过大", "too large"]
          message: "文件超过了大小限制。PDF 切分/压缩/转图片上限 50MB，合并单个上限 5MB。"
          log-error: false
        - keywords: ["文件不存在", "已过期"]
          message: "文件已过期或不存在，请重新上传。"
          log-error: false
        - keywords: ["加密", "encrypted"]
          message: "该 PDF 有密码保护，请解密后重新上传。"
          log-error: false
        - keywords: ["格式", "format", "不支持"]
          message: "文件格式不支持。支持的格式: PDF / DOC / DOCX / WPS / MD。"
          log-error: false
        # 操作层 — 参数/逻辑
        - keywords: ["至少需要", "too few"]
          message: "文件数量不足。{msg}"
          log-error: false
        - keywords: ["最多", "too many"]
          message: "文件数量超出限制。{msg}"
          log-error: false
        - keywords: ["页", "page"]
          message: "页码范围有误。{msg}"
          log-error: false
        - keywords: ["等级", "level", "1-5"]
          message: "压缩等级无效，有效范围 1-5。"
          log-error: false
        - keywords: ["不可用", "unavailable"]
          message: "文档转 PDF 服务暂不可用（LibreOffice 未启动），请联系管理员。"
          log-error: false
        - keywords: ["轮次", "上限"]
          message: "{msg}"
          log-error: false
        # 系统层 — 兜底
        - keywords: ["timeout", "timed out", "超时"]
          message: "AI 服务响应超时，请稍后重试。"
          log-error: true
        - keywords: ["disk", "空间"]
          message: "服务器存储空间不足，请联系管理员。"
          log-error: true

logging:
  level:
    root: INFO
    com.toolbox: DEBUG

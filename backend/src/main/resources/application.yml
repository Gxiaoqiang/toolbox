server:
  port: 8898

spring:
  application:
    name: toolbox
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

toolbox:
  libreoffice:
    # soffice 二进制路径
    binary-path: soffice
    # 最大并发转换数（每个 soffice 进程约占用 200-500MB 内存）
    max-concurrent: 10
  # ============================================
  # Agent — 文档处理 AI Agent 配置
  # ============================================
  agent:
    # LLM 提供商: dashscope / openai / deepseek
    llm-provider: deepseek
    llm-model: deepseek-v4-pro
    # API Key
    llm-api-key: sk-7c4596ab33fd44798299a5332002bcfa
    # API Base URL（可选。内网部署时改为自己的 OpenAI 兼容代理地址）
    llm-base-url:
    # SSE 连接管理
    sse:
      max-connections: 50
      heartbeat-interval-ms: 15000
      connection-timeout-ms: 7200000
    # 对话管理
    conversation:
      max-rounds: 50
      ttl-minutes: 30
    # 文件管理
    file:
      upload-dir: /tmp/toolbox-agent
      cleanup-interval-minutes: 2400
      max-file-size: 52428800

logging:
  level:
    root: INFO
    com.toolbox: DEBUG
